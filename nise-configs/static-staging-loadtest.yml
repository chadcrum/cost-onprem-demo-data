---
# Staging Environment
# Realistic pattern: Deployment waves, load testing, pre-production validation
generators:
  - OCPGenerator:
      start_date: START_DATE
      end_date: END_DATE
      nodes:
        - node:
          node_name: CLUSTER_ID-worker-1
          cpu_cores: 8
          memory_gig: 32
          resource_id: CLUSTER_ID-node-1
          labels: node-role.kubernetes.io/worker:true|workload:staging
          namespaces:
            staging-app:
              labels: env:staging|team:engineering
              pods:
                # Staging app - deployed weekly with load tests
                - pod:
                  pod_name: staging-app-1
                  cpu_request: 2.0
                  mem_request_gig: 4.0
                  cpu_limit: 4.0
                  mem_limit_gig: 8.0
                  pod_seconds: 64800  # Up ~18hrs/day (not 24/7)
                  cpu_usage:
                    jan_1-5: 0.4      # Low - holidays
                    jan_6: 2.8        # Deploy + load test
                    jan_7-12: 0.6     # Idle
                    jan_13: 3.2       # Load test spike
                    jan_14-19: 0.5    # Testing
                    jan_20: 3.5       # Pre-prod validation
                    jan_21-26: 0.7    # QA testing
                    jan_27: 3.0       # Final validation
                    jan_28-31: 0.8    # Ready for prod
                    feb_1-2: 0.4
                    feb_3: 2.9        # New deploy
                    feb_4-5: 0.9
                  mem_usage_gig:
                    jan_1-5: 1.2
                    jan_6: 6.5
                    jan_7-12: 1.8
                    jan_13: 7.0
                    jan_14-19: 1.5
                    jan_20: 7.2
                    jan_21-26: 2.0
                    jan_27: 6.8
                    jan_28-31: 2.2
                    feb_1-2: 1.3
                    feb_3: 6.6
                    feb_4-5: 2.5
                  labels: app:webapp|env:staging|team:qa
                
                # Load testing tool - runs during validation
                - pod:
                  pod_name: locust-loadtest
                  cpu_request: 3.0
                  mem_request_gig: 8.0
                  cpu_limit: 6.0
                  mem_limit_gig: 12.0
                  pod_seconds: 7200   # 2 hours during load tests
                  cpu_usage:
                    jan_1-5: 0
                    jan_6: 5.5        # Load test
                    jan_7-12: 0
                    jan_13: 5.8       # Load test
                    jan_14-19: 0
                    jan_20: 5.6       # Load test
                    jan_21-26: 0
                    jan_27: 5.4       # Load test
                    jan_28-31: 0
                    feb_1-2: 0
                    feb_3: 5.7        # Load test
                    feb_4-5: 0
                  mem_usage_gig:
                    jan_1-5: 0
                    jan_6: 10.5
                    jan_7-12: 0
                    jan_13: 11.0
                    jan_14-19: 0
                    jan_20: 10.8
                    jan_21-26: 0
                    jan_27: 10.2
                    jan_28-31: 0
                    feb_1-2: 0
                    feb_3: 10.9
                    feb_4-5: 0
                  labels: app:loadtest|component:locust|team:qa|workload:batch
